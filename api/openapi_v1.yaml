        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Motor de plazos
  /api/v1/deadline-calculations:
    post:
      tags: [Motor de plazos]
      summary: Vista previa de un cálculo de plazo
      description: No guarda nada. Usa el calendario del departamento del expediente, los inhábiles del estudio y las suspensiones del expediente. Devuelve los días computados para la pantalla "por qué vence ese día".
      operationId: calcularPlazo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineCalculationRequest'
      responses:
        '200':
          description: Resultado del motor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineCalculationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- Alertas
  /api/v1/dashboard:
    get:
      tags: [Alertas]
      summary: Dashboard de alertas
      description: Vencidos sin cumplir, último momento (gracia), rojo, amarillo y oportunidades de la contraparte, según los umbrales de `alert-settings`.
      operationId: obtenerDashboard
      responses:
        '200':
          description: Alertas del usuario en el estudio activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Suscripción
  /api/v1/plans:
    get:
      tags: [Suscripción]
      summary: Planes y tramos contratables
      operationId: listarPlanes
      security: []
      responses:
        '200':
          description: Planes activos.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Plan'
  /api/v1/subscription:
    get:
      tags: [Suscripción]
      summary: Suscripción del estudio y uso del plan
      operationId: obtenerSuscripcion
      responses:
        '200':
          description: Suscripción.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/subscription/checkout:
    post:
      tags: [Suscripción]
      summary: Iniciar el pago de un plan
      description: El backend crea el checkout en el proveedor con el plan y el precio de la base; el cliente no envía importes.
      operationId: iniciarCheckout
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSelection'
      responses:
        '201':
          description: Checkout creado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [checkoutUrl]
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                    description: URL del checkout alojado del proveedor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/subscription/plan-change/preview:
    post:
      tags: [Suscripción]
      summary: Simular un cambio de plan
      operationId: simularCambioPlan
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSelection'
      responses:
        '200':
          description: Efecto del cambio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/subscription/plan-change:
    post:
      tags: [Suscripción]
      summary: Cambiar de plan
      description: La subida es inmediata. La bajada se programa para el próximo período y responde 409 si los clientes activos superan el nuevo límite (`PLAN_CAMBIADO`).
      operationId: cambiarPlan
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSelection'
      responses:
        '200':
          description: Cambio aplicado o programado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/subscription/cancellation:
    post:
      tags: [Suscripción]
      summary: Dar de baja
      description: Botón de baja. Tiene efecto al final del período pagado; confirma por email con número de trámite (`BAJA_SOLICITADA`).
      operationId: darDeBaja
      x-roles: [TITULAR]
      responses:
        '200':
          description: Baja registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Suscripción]
      summary: Dejar sin efecto la baja antes del fin del período
      operationId: anularBaja
      x-roles: [TITULAR]
      responses:
        '204':
          description: La suscripción sigue activa.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/subscription/withdrawal:
    post:
      tags: [Suscripción]
      summary: Arrepentimiento
      description: Dentro de los 10 días corridos de la contratación o del primer cobro. Devuelve lo cobrado y genera una nota de crédito (`ARREPENTIMIENTO_SOLICITADO`). Fuera de plazo, 409.
      operationId: arrepentirse
      x-roles: [TITULAR]
      responses:
        '200':
          description: Arrepentimiento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Facturación
  /api/v1/billing-profile:
    get:
      tags: [Facturación]
      summary: Datos fiscales del estudio
      operationId: obtenerDatosFiscales
      x-roles: [TITULAR]
      responses:
        '200':
          description: Datos fiscales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Facturación]
      summary: Cargar o actualizar los datos fiscales
      description: Valida el dígito verificador del CUIT. Las facturas ya emitidas no cambian.
      operationId: actualizarDatosFiscales
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingProfile'
      responses:
        '200':
          description: Datos fiscales guardados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/invoices:
    get:
      tags: [Facturación]
      summary: Facturas del estudio
      operationId: listarFacturas
      x-roles: [TITULAR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de facturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/invoices/{invoiceId}/pdf:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags: [Facturación]
      summary: Descargar el PDF de una factura autorizada
      operationId: descargarFactura
      x-roles: [TITULAR]
      responses:
        '200':
          description: PDF con código QR.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Exportación
  /api/v1/exports:
    post:
      tags: [Exportación]
      summary: Pedir la exportación completa del estudio
      description: Asíncrona. Incluye clientes, expedientes, pasos e historial (`DATOS_EXPORTADOS`). Se permite también en solo lectura.
      operationId: pedirExportacion
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [format]
              properties:
                format:
                  type: string
                  enum: [JSON, XLSX]
      responses:
        '202':
          description: Exportación en preparación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags: [Exportación]
      summary: Estado de una exportación
      operationId: obtenerExportacion
      x-roles: [TITULAR]
      responses:
        '200':
          description: Estado; si está lista, incluye un enlace firmado de un solo uso válido por 24 horas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Webhooks
  /webhooks/payments/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [mercado-pago]
    post:
      tags: [Webhooks]
      summary: Avisos del proveedor de pagos
      description: |
        Sin sesión. Se procesa solo si la firma del proveedor es válida y está dentro de la ventana de tiempo.
        El estado del pago se confirma consultando la API del proveedor, y el importe se compara con el precio del plan.
        Un mismo evento se procesa una sola vez (`UNIQUE (provider, provider_event_id)`).
        El formato exacto del cuerpo y de los headers de firma depende del proveedor elegido.
      operationId: recibirWebhookPagos
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Cuerpo definido por el proveedor; solo se guardan los campos de la lista permitida.
      responses:
        '200':
          description: Evento recibido (también si era un duplicado).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Firma inválida. Se registra y genera alerta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- Back-office
  /api/admin/v1/calendar-changes/preview:
    post:
      tags: [Back-office]
      summary: Simular un cambio de calendario
      description: Informa cuántos pasos pendientes cambian y cuántos se atrasan (modelado de amenazas, MOT-02).
      operationId: simularCambioCalendario
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarChangeSet'
      responses:
        '200':
          description: Impacto del cambio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarChangeImpact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/v1/calendar-changes:
    post:
      tags: [Back-office]
      summary: Aplicar un cambio de calendario
      description: Incrementa la versión del calendario y recalcula los pasos afectados. Si algún vencimiento se atrasa, exige `confirmDelays` (`CALENDARIO_MODIFICADO`).
      operationId: aplicarCambioCalendario
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarChangeSet'
      responses:
        '200':
          description: Cambio aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarChangeImpact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/v1/calendar-coverage:
    get:
      tags: [Back-office]
      summary: Cobertura del calendario por jurisdicción
      operationId: listarCobertura
      x-roles: [ADMIN]
      responses:
        '200':
          description: Cobertura.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/CalendarCoverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Back-office]
      summary: Actualizar la cobertura (por ejemplo, pasar a OFICIAL)
      description: El estado `OFICIAL` exige un validador distinto del usuario que publica.
      operationId: actualizarCobertura
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarCoverage'
      responses:
        '200':
          description: Cobertura actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarCoverage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/v1/flow-imports:
    post:
      tags: [Back-office]
      summary: Importar una planilla de matriz
      description: Máximo 5 MB. Se valida que sea un ZIP de Office por sus bytes iniciales, con límites de descompresión y sin evaluar fórmulas. Aplica las validaciones del documento de proyecto, sección 4.
      operationId: importarMatriz
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, flowId]
              properties:
                file:
                  type: string
                  format: binary
                flowId:
                  $ref: '#/components/schemas/Id'
            encoding:
              file:
                contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: Importación validada (con o sin errores).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Archivo demasiado grande.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/admin/v1/flow-imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Back-office]
      summary: Resultado de una importación
      operationId: obtenerImportacion
      x-roles: [ADMIN]
      responses:
        '200':
          description: Importación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/v1/flow-imports/{importId}/publish:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Back-office]
      summary: Publicar la importación como nueva versión del flujo
      description: Solo si la importación no tiene errores. La versión publicada es inmutable; los expedientes existentes conservan la suya.
      operationId: publicarVersionFlujo
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approvedByLegal]
              properties:
                approvedByLegal:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Quién del equipo legal validó el contenido de la matriz.
                notes:
                  type: string
                  maxLength: 2000
                  description: Qué cambió respecto de la versión anterior.
      responses:
        '201':
          description: Versión publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowVersionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/v1/jurisdiction-schedules:
    get:
