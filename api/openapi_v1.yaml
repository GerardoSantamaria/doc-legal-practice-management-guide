        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/v1/courts:
    post:
      tags: [Back-office]
      summary: Crear un tribunal
      operationId: crearTribunal
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtInput'
      responses:
        '201':
          description: Tribunal creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/v1/courts/{courtId}:
    parameters:
      - name: courtId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    put:
      tags: [Back-office]
      summary: Actualizar un tribunal
      description: No se puede cambiar el régimen de un tribunal con expedientes judiciales asignados.
      operationId: actualizarTribunal
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourtInput'
      responses:
        '200':
          description: Tribunal actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-SESSION
      description: Cookie de sesión propia del backend. En operaciones que modifican datos se exige además el header `X-XSRF-TOKEN`.

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Query:
      name: q
      in: query
      description: Texto de búsqueda.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Datos inválidos. `errors` lista los campos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sin sesión válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sin permiso para la operación, o suscripción en solo lectura (`suscripcion-solo-lectura`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existe o no pertenece al estudio activo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Conflicto con el estado actual. Tipos posibles: `limite-clientes`, `limite-usuarios`, `retroceso-con-dependientes`,
        `retroceso-requiere-confirmacion`, `paso-no-pendiente`, `plazo-arrepentimiento-vencido`, `bajada-supera-limite`,
        `vencimientos-atrasados-sin-confirmar`, `importacion-con-errores`, `cliente-con-expedientes-activos`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        Datos válidos que no se pueden procesar. Tipos posibles: `regimen-sin-definir`, `calendario-no-cargado`,
        `tipo-no-admite-gracia`, `tipo-no-admite-prorroga`, `valor-fuera-de-rango`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Límite de peticiones superado.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------ Comunes
    Id:
      type: string
      format: uuid
    Reason:
      type: string
      minLength: 3
      maxLength: 500
      description: Motivo. No incluir datos de salud ni otros datos sensibles.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Ej. `/problemas/limite-clientes`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
          description: Permite cruzar con los logs internos.
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    CatalogItem:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string

    # ------------------------------------------------------------ Enums
    TermType:
      type: string
      enum: [HABILES_JUDICIALES, CORRIDOS, HABILES_ADMINISTRATIVOS, MESES, ANIOS, HORAS, FECHA_FIJADA, ANTICIPACION_HABILES_JUDICIALES, SIN_PLAZO]
    DeadlineLimitType:
      type: string
      enum: [CIERRE_HORARIO_JUDICIAL, FIN_DEL_DIA]
    StepStatus:
      type: string
      enum: [PENDIENTE, COMPLETADO, SALTEADO, NO_CUMPLIDO, ANULADO]
    CalculationStatus:
      type: string
      enum: [CALCULADO, SIN_VENCIMIENTO, CALENDARIO_NO_CARGADO, MANUAL]
    NotificationType:
      type: string
      enum: [CEDULA_PAPEL, ELECTRONICA, MINISTERIO_LEY, PERSONAL, OTRA]
    MembershipRole:
      type: string
      enum: [TITULAR, ABOGADO, ASISTENTE]
    CaseStatus:
      type: string
      enum: [ACTIVO, PAUSADO, TERMINADO]
    RepresentedRole:
      type: string
      enum: [ACTORA, DEMANDADA]
    ResponsibleRole:
      type: string
      enum: [ACTORA, DEMANDADA, TRIBUNAL, AMBAS]
    Perspective:
      type: string
      description: Cruce del responsable del paso con el rol representado.
      enum: [PROPIO, CONTRAPARTE, TRIBUNAL]
    CourtType:
      type: string
      enum: [TRIBUNAL_TRABAJO, JUZGADO_LABORAL, CAMARA_APELACION]
    AlertLevel:
      type: string
      enum: [VENCIDO_SIN_CUMPLIR, ULTIMO_MOMENTO, ROJO, AMARILLO, OPORTUNIDAD]

    # ------------------------------------------------------------ Sesión y usuario
    Session:
      type: object
      additionalProperties: false
      required: [userId, activeOrganizationId, memberships, systemRole]
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        systemRole:
          type: string
          enum: [USUARIO, ADMIN]
        activeOrganizationId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        memberships:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [organizationId, organizationName, role]
            properties:
              organizationId:
                $ref: '#/components/schemas/Id'
              organizationName:
                type: string
              role:
                $ref: '#/components/schemas/MembershipRole'
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      additionalProperties: false
      required: [id, fullName, primaryEmail]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
        primaryEmail:
          type: string
          format: email
        lastLoginAt:
          type: string
          format: date-time
    Device:
      type: object
      additionalProperties: false
      required: [id, displayName, firstSeenAt, lastSeenAt, current]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
          description: Ej. "Chrome en Windows".
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Si es el dispositivo de esta petición.
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [dailyDigestEnabled, digestIncludesCaseDetails, counterpartyAlertsEnabled]
      properties:
        dailyDigestEnabled:
          type: boolean
        digestIncludesCaseDetails:
          type: boolean
          description: Por defecto `false` (minimización de datos).
        counterpartyAlertsEnabled:
          type: boolean
    LegalDocumentVersion:
      type: object
      additionalProperties: false
      required: [id, documentType, version, url, contentSha256, effectiveAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        documentType:
          type: string
          enum: [TERMINOS, PRIVACIDAD, ENCARGO_DEL_TRATAMIENTO]
        version:
          type: string
        url:
          type: string
          format: uri
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        effectiveAt:
          type: string
          format: date-time
        changeSummary:
          type: string

    # ------------------------------------------------------------ Estudio
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        type:
          type: string
          enum: [INDIVIDUAL, ESTUDIO]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        type:
          type: string
          enum: [INDIVIDUAL, ESTUDIO]
    Member:
      type: object
      additionalProperties: false
      required: [membershipId, fullName, email, role, status]
      properties:
        membershipId:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          type: string
          enum: [INVITADO, ACTIVO, REVOCADO]
    AlertSettings:
      type: object
      additionalProperties: false
      required: [redBusinessDays, yellowBusinessDays, digestTime, digestLookaheadBusinessDays]
      properties:
        scope:
          type: string
          enum: [GLOBAL, ORGANIZACION]
          readOnly: true
        redBusinessDays:
          type: integer
          minimum: 0
          maximum: 10
        yellowBusinessDays:
          type: integer
          minimum: 1
          maximum: 30
          description: Debe ser mayor que `redBusinessDays`.
        digestTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Hora local de la jurisdicción, `HH:MM`.
        digestLookaheadBusinessDays:
          type: integer
          minimum: 1
          maximum: 30

    # ------------------------------------------------------------ Catálogos
    Court:
      type: object
      additionalProperties: false
      required: [id, name, departmentId, courtType, proceduralRegimeCode, isActive]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        departmentId:
          $ref: '#/components/schemas/Id'
        courtType:
          $ref: '#/components/schemas/CourtType'
        proceduralRegimeCode:
          type: string
          enum: [PBA_LAB_LEY_11653, PBA_LAB_LEY_15057]
        isActive:
          type: boolean
    CourtInput:
      type: object
      additionalProperties: false
      required: [name, departmentId, courtType, proceduralRegimeCode, isActive]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
        departmentId:
          $ref: '#/components/schemas/Id'
        courtType:
          $ref: '#/components/schemas/CourtType'
        proceduralRegimeCode:
          type: string
          enum: [PBA_LAB_LEY_11653, PBA_LAB_LEY_15057]
        isActive:
          type: boolean
    RegimeResolution:
      type: object
      additionalProperties: false
      required: [result, hasPublishedFlow]
      properties:
        result:
          type: string
          enum: [DEFINIDO, INCONSISTENTE, SIN_DEFINIR]
        regimeCode:
          type: string
          enum: [PBA_LAB_LEY_11653, PBA_LAB_LEY_15057]
        source:
          type: string
          enum: [TRIBUNAL, DEPARTAMENTO_Y_FECHA]
        regimeByCourt:
          type: string
        regimeByDepartment:
          type: string
        hasPublishedFlow:
          type: boolean
          description: Si es `false`, el expediente solo admite plazos sueltos.
    FlowGraph:
      type: object
      additionalProperties: false
      required: [flowVersionId, flowKind, nodes, transitions]
      properties:
        flowVersionId:
          $ref: '#/components/schemas/Id'
        flowKind:
          type: string
          enum: [PREJUDICIAL, JUDICIAL]
        nodes:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FlowNode'
        transitions:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/FlowTransition'
    FlowNode:
      type: object
      additionalProperties: false
      required: [id, code, name, phase, responsibleRole, termType, defaultTermValue, appliesGracePeriod, isInitial, isFinal]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          description: Ej. `LAB_050`.
        name:
          type: string
        phase:
          type: string
        responsibleRole:
          $ref: '#/components/schemas/ResponsibleRole'
        termType:
          $ref: '#/components/schemas/TermType'
        defaultTermValue:
          type: integer
        appliesGracePeriod:
          type: boolean
        legalBasis:
          type: string
        isInitial:
          type: boolean
        isFinal:
          type: boolean
    FlowTransition:
      type: object
      additionalProperties: false
      required: [id, fromNodeId, condition]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fromNodeId:
          $ref: '#/components/schemas/Id'
        condition:
          type: string
        toNodeId:
          description: '`null` = cierra el camino.'
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    CalendarDay:
      type: object
      additionalProperties: false
      required: [id, date, kind, scope, description]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        date:
          type: string
          format: date
        kind:
          type: string
          enum: [FERIADO, FERIA, ASUETO, INHABIL_MANUAL]
        scope:
          type: string
          enum: [NACIONAL, PROVINCIAL, DEPARTAMENTO, ORGANIZACION]
        description:
          type: string
        legalReference:
          type: string
    CalendarView:
      type: object
      additionalProperties: false
      required: [coverage, days]
      properties:
        coverage:
          $ref: '#/components/schemas/CalendarCoverage'
        days:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/CalendarDay'

    # ------------------------------------------------------------ Clientes
    ClientFields:
      type: object
      required: [personType, fullNameOrCompany]
      properties:
        personType:
          type: string
          enum: [HUMANA, JURIDICA]
        fullNameOrCompany:
          type: string
          minLength: 2
          maxLength: 200
        taxId:
          type: string
          pattern: '^[0-9]{7,11}$'
          description: DNI o CUIT, sin guiones.
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
    ClientInput:
      allOf:
        - $ref: '#/components/schemas/ClientFields'
      unevaluatedProperties: false
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientFields'
        - type: object
          required: [id, isActiveForPlan]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            isActiveForPlan:
              type: boolean
              description: Si cuenta en el límite de clientes activos.
      unevaluatedProperties: false
    ClientPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Client'
        meta:
          $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------ Expedientes
    InProgressStep:
      type: object
      additionalProperties: false
      required: [nodeId]
      description: Hito actual de un expediente en curso. Se carga el inicio del cómputo o, si no se conoce, el vencimiento a mano con motivo.
      properties:
        nodeId:
          $ref: '#/components/schemas/Id'
        startDate:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        manualDue:
          $ref: '#/components/schemas/ManualDue'
    ManualDue:
      type: object
      additionalProperties: false
      required: [ordinaryLimitAt, reason]
      properties:
        ordinaryLimitAt:
          type: string
          format: date-time
        graceLimitAt:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/Reason'
    CaseCreate:
      type: object
      additionalProperties: false
      required: [clientId, caseTitle, jurisdictionId, departmentId, representedRole, startStage]
      properties:
        clientId:
          $ref: '#/components/schemas/Id'
        caseTitle:
          type: string
          minLength: 3
          maxLength: 300
        caseNumber:
          type: string
          maxLength: 60
        receptoriaNumber:
          type: string
          maxLength: 60
        jurisdictionId:
          $ref: '#/components/schemas/Id'
        departmentId:
          $ref: '#/components/schemas/Id'
        courtId:
          $ref: '#/components/schemas/Id'
        representedRole:
          $ref: '#/components/schemas/RepresentedRole'
        startStage:
          type: string
          enum: [PREJUDICIAL, JUDICIAL]
          description: '`JUDICIAL` exige `courtId`.'
        claimFiledOn:
          type: string
          format: date
        inProgress:
          type: object
          additionalProperties: false
          required: [currentSteps]
          properties:
            currentSteps:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/InProgressStep'
    CaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        caseTitle:
          type: string
          minLength: 3
          maxLength: 300
        caseNumber:
          type: string
          maxLength: 60
        receptoriaNumber:
          type: string
          maxLength: 60
        courtId:
          $ref: '#/components/schemas/Id'
        responsibleUserId:
          $ref: '#/components/schemas/Id'
        currentStatus:
          type: string
          enum: [ACTIVO, PAUSADO]
    CaseSummary:
      type: object
      additionalProperties: false
      required: [id, caseTitle, clientId, clientName, representedRole, currentStatus]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        caseTitle:
          type: string
        caseNumber:
          type: string
        clientId:
          $ref: '#/components/schemas/Id'
        clientName:
          type: string
        courtName:
          type: string
        representedRole:
          $ref: '#/components/schemas/RepresentedRole'
        currentStatus:
          $ref: '#/components/schemas/CaseStatus'
        currentMilestones:
          type: array
          maxItems: 20
          items:
            type: string
        nextDueAt:
          type: string
          format: date-time
    Case:
      type: object
      additionalProperties: false
      required: [id, caseTitle, clientId, jurisdictionId, departmentId, representedRole, currentStatus, loadedInProgress]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        caseTitle:
          type: string
        caseNumber:
          type: string
        receptoriaNumber:
          type: string
        clientId:
          $ref: '#/components/schemas/Id'
        responsibleUserId:
          $ref: '#/components/schemas/Id'
        jurisdictionId:
          $ref: '#/components/schemas/Id'
        departmentId:
          $ref: '#/components/schemas/Id'
        courtId:
          $ref: '#/components/schemas/Id'
        representedRole:
          $ref: '#/components/schemas/RepresentedRole'
        currentStatus:
          $ref: '#/components/schemas/CaseStatus'
        prejudicialFlowVersionId:
          $ref: '#/components/schemas/Id'
        judicialFlowVersionId:
          $ref: '#/components/schemas/Id'
        proceduralRegimeCode:
          type: string
        regimeSource:
          type: string
          enum: [TRIBUNAL, DEPARTAMENTO_Y_FECHA]
        regimeWarning:
          type: string
          description: Presente si el régimen del tribunal no coincide con el del departamento y la fecha.
        onlyStandaloneSteps:
          type: boolean
          description: '`true` si el régimen no tiene flujo publicado.'
        claimFiledOn:
          type: string
          format: date
        loadedInProgress:
          type: boolean
        closedOn:
          type: string
          format: date
        closedReason:
          type: string
          enum: [SENTENCIA, ACUERDO, DESISTIMIENTO, OTRO]
    CasePage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CaseSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PartyFields:
      type: object
      required: [partyRole, name]
      properties:
        partyRole:
          type: string
          enum: [ACTORA, DEMANDADA, TERCERO]
        name:
          type: string
          minLength: 2
          maxLength: 200
        taxId:
          type: string
          pattern: '^[0-9]{7,11}$'
        counselName:
          type: string
          maxLength: 200
    PartyInput:
      allOf:
        - $ref: '#/components/schemas/PartyFields'
      unevaluatedProperties: false
    Party:
      allOf:
        - $ref: '#/components/schemas/PartyFields'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
      unevaluatedProperties: false
    SuspensionFields:
      type: object
      required: [startsOn, endsOn, reason]
      properties:
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
          description: Igual o posterior a `startsOn`.
        reason:
          type: string
          enum: [ACUERDO_DE_PARTES, RESOLUCION_DEL_TRIBUNAL, OTRO]
        legalReference:
          type: string
          maxLength: 300
    SuspensionInput:
      allOf:
        - $ref: '#/components/schemas/SuspensionFields'
      unevaluatedProperties: false
    Suspension:
      allOf:
        - $ref: '#/components/schemas/SuspensionFields'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
      unevaluatedProperties: false
    Roadmap:
      type: object
      additionalProperties: false
      required: [nodes, transitions]
      properties:
        nodes:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [nodeId, code, name, phase, perspective, state]
            properties:
              nodeId:
                $ref: '#/components/schemas/Id'
              code:
                type: string
              name:
                type: string
              phase:
                type: string
              perspective:
                $ref: '#/components/schemas/Perspective'
              state:
                type: string
                enum: [FUTURO, ACTUAL, VENCIDO, COMPLETADO, SALTEADO, NO_CUMPLIDO, ANULADO, ANTERIOR_A_LA_CARGA]
              stepIds:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Id'
        transitions:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/FlowTransition'
    HistoryEvent:
      type: object
      additionalProperties: false
      required: [occurredAt, action, actorName]
      properties:
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          description: Acción de `audit_events`, ej. `PLAZO_EDITADO`.
        actorName:
          type: string
        stepId:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
        changes:
          type: object
          description: Solo los campos de la lista permitida para ese tipo de entidad.
    HistoryPage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HistoryEvent'
        meta:
          $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------ Pasos y motor
    DeadlineResult:
      type: object
      additionalProperties: false
      required: [calculationStatus, calculatedWithProvisionalCalendar, calendarIncomplete, warnings]
      properties:
        calculationStatus:
          $ref: '#/components/schemas/CalculationStatus'
        nominalDueDate:
          type: string
          format: date
          description: Fecha de alerta.
        effectiveDueDate:
          type: string
          format: date
        ordinaryLimitAt:
          type: string
          format: date-time
        graceLimitAt:
          type: string
          format: date-time
        calculatedWithProvisionalCalendar:
          type: boolean
        calendarIncomplete:
          type: boolean
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            description: Ej. `FECHA_EN_DIA_INHABIL`.
        calendarVersion:
          type: integer
    Step:
      type: object
      additionalProperties: false
      required: [id, caseId, title, status, responsibleRole, perspective, termType, termValue, appliesGracePeriod, deadlineLimitType, extensionDays, loadedInProgress, deadline]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        caseId:
          $ref: '#/components/schemas/Id'
        nodeId:
          description: '`null` = plazo suelto.'
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        title:
          type: string
          description: Nombre del hito, o título del plazo suelto.
        status:
          $ref: '#/components/schemas/StepStatus'
        statusReason:
          type: string
        isOverdue:
          type: boolean
          description: Derivado (pendiente con el límite ya pasado); no se guarda.
        responsibleRole:
          $ref: '#/components/schemas/ResponsibleRole'
        perspective:
          $ref: '#/components/schemas/Perspective'
        originStepId:
          $ref: '#/components/schemas/Id'
        relatedStepId:
          $ref: '#/components/schemas/Id'
        termType:
          $ref: '#/components/schemas/TermType'
        termValue:
          type: integer
        termOverrideReason:
          type: string
        appliesGracePeriod:
          type: boolean
        deadlineLimitType:
          $ref: '#/components/schemas/DeadlineLimitType'
        extensionDays:
          type: integer
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        startDate:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        deadline:
          description: '`null` mientras no se cargue el inicio del cómputo.'
          oneOf:
            - $ref: '#/components/schemas/DeadlineResult'
            - type: 'null'
        loadedInProgress:
          type: boolean
        filedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, kind, text, done]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [TAREA, DOCUMENTACION]
        text:
          type: string
        done:
          type: boolean
    StepDetail:
      type: object
      additionalProperties: false
      required: [step, checklist, availableTransitions]
      properties:
        step:
          $ref: '#/components/schemas/Step'
        checklist:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChecklistItem'
        availableTransitions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FlowTransition'
    StepTransitionResult:
      type: object
      additionalProperties: false
      required: [step, openedSteps]
      properties:
        step:
          $ref: '#/components/schemas/Step'
        openedSteps:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Step'
    StepRevertResult:
      type: object
      additionalProperties: false
      required: [reopenedStep, annulledSteps]
      properties:
        reopenedStep:
          $ref: '#/components/schemas/Step'
        annulledSteps:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Step'
    DeadlineUpdate:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        termValue:
          type: integer
          minimum: 0
          maximum: 720
        termOverrideReason:
          $ref: '#/components/schemas/Reason'
        appliesGracePeriod:
          type: boolean
        extensionDays:
          type: integer
          minimum: 0
          maximum: 30
        extensionReason:
          $ref: '#/components/schemas/Reason'
        manualDue:
          $ref: '#/components/schemas/ManualDue'
    StandaloneStepCreate:
      type: object
      additionalProperties: false
      required: [title, termType, termValue, appliesGracePeriod]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: No incluir datos de salud ni otros datos sensibles.
        termType:
          $ref: '#/components/schemas/TermType'
        termValue:
          type: integer
          minimum: 0
          maximum: 720
        appliesGracePeriod:
          type: boolean
        deadlineLimitType:
          $ref: '#/components/schemas/DeadlineLimitType'
        responsibleRole:
          $ref: '#/components/schemas/ResponsibleRole'
        startDate:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        relatedStepId:
          $ref: '#/components/schemas/Id'
    DeadlineCalculationRequest:
      type: object
      additionalProperties: false
      required: [caseId, termType, termValue, appliesGracePeriod]
      properties:
        caseId:
          $ref: '#/components/schemas/Id'
        termType:
          $ref: '#/components/schemas/TermType'
        termValue:
          type: integer
          minimum: 0
          maximum: 720
        appliesGracePeriod:
          type: boolean
        deadlineLimitType:
          $ref: '#/components/schemas/DeadlineLimitType'
        startDate:
          type: string
          format: date
        startAt:
          type: string
          format: date-time
        extensionDays:
          type: integer
          minimum: 0
          maximum: 30
    DeadlineCalculationResult:
      type: object
      additionalProperties: false
      required: [result, computedDays]
      properties:
        result:
          $ref: '#/components/schemas/DeadlineResult'
        computedDays:
          type: array
          maxItems: 800
          description: Días recorridos por el cómputo, con el motivo de los que se saltearon.
          items:
            type: object
            additionalProperties: false
            required: [date, counted]
            properties:
              date:
                type: string
                format: date
              counted:
                type: boolean
              skippedReason:
                type: string
                description: Ej. "Feriado nacional", "Feria judicial", "Suspensión del expediente".

    # ------------------------------------------------------------ Alertas
    DashboardItem:
      type: object
      additionalProperties: false
      required: [level, stepId, caseId, caseTitle, clientName, actionTitle, limitAt]
      properties:
        level:
          $ref: '#/components/schemas/AlertLevel'
        stepId:
          $ref: '#/components/schemas/Id'
        caseId:
          $ref: '#/components/schemas/Id'
        caseTitle:
          type: string
        caseNumber:
          type: string
        clientName:
          type: string
        actionTitle:
          type: string
          description: Ej. "Contestación de la demanda".
        limitAt:
          type: string
          format: date-time
        graceLimitAt:
          type: string
          format: date-time
        suggestedAction:
          type: string
          description: En oportunidades, ej. "Pedir que se tenga por no contestada la demanda".
        approximate:
          type: boolean
          description: Calendario provisorio o incompleto.
    Dashboard:
      type: object
      additionalProperties: false
      required: [overdueUnfulfilled, lastMoment, red, yellow, opportunities, calendarStatus]
      properties:
        overdueUnfulfilled:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DashboardItem'
        lastMoment:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DashboardItem'
        red:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DashboardItem'
        yellow:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DashboardItem'
        opportunities:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DashboardItem'
        calendarStatus:
          $ref: '#/components/schemas/CalendarCoverage'

    # ------------------------------------------------------------ Suscripción y facturación
    Plan:
      type: object
      additionalProperties: false
      required: [id, code, name, family, tierRank, includedSeats, maxDevicesPerUser, billingPeriod, priceAmount, currency, trialDays]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        family:
          type: string
          enum: [INDIVIDUAL, ESTUDIO]
        tierRank:
          type: integer
        maxActiveClients:
          description: '`null` = sin límite.'
          oneOf:
            - type: integer
            - type: 'null'
        includedSeats:
          type: integer
        maxSeats:
          oneOf:
            - type: integer
            - type: 'null'
        extraSeatPriceAmount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        maxDevicesPerUser:
          type: integer
        billingPeriod:
          type: string
          enum: [MENSUAL, ANUAL]
        priceAmount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Precio final con impuestos incluidos. Decimal como texto para no perder precisión.
        currency:
          type: string
          enum: [ARS]
        trialDays:
          type: integer
    PlanSelection:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId:
          $ref: '#/components/schemas/Id'
        seats:
          type: integer
          minimum: 1
          maximum: 500
          description: Solo en planes `ESTUDIO`.
    PlanChangePreview:
      type: object
      additionalProperties: false
      required: [effective, allowed]
      properties:
        effective:
          type: string
          enum: [INMEDIATO, PROXIMO_PERIODO]
        allowed:
          type: boolean
        notAllowedReason:
          type: string
        amountDueNow:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        effectiveAt:
          type: string
          format: date-time
    Subscription:
      type: object
      additionalProperties: false
      required: [status, plan, seats, usage, cancelAtPeriodEnd]
      properties:
        status:
          type: string
          enum: [PRUEBA, ACTIVA, EN_MORA, SOLO_LECTURA, CANCELADA]
        plan:
          $ref: '#/components/schemas/Plan'
        scheduledPlan:
          $ref: '#/components/schemas/Plan'
        seats:
          type: integer
        trialEndsAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        readOnlyUntil:
          type: string
          format: date-time
        deletionScheduledFor:
          type: string
          format: date
        withdrawalAvailableUntil:
          type: string
          format: date-time
          description: Fin del plazo de arrepentimiento; ausente si ya venció.
        usage:
          type: object
          additionalProperties: false
          required: [activeClients, seatsUsed]
          properties:
            activeClients:
              type: integer
            maxActiveClients:
              oneOf:
                - type: integer
                - type: 'null'
            seatsUsed:
              type: integer
    CancellationReceipt:
      type: object
      additionalProperties: false
      required: [ticket, accessUntil, readOnlyUntil, deletionScheduledFor]
      properties:
        ticket:
          type: string
          description: Número de trámite.
        accessUntil:
          type: string
          format: date-time
        readOnlyUntil:
          type: string
          format: date-time
        deletionScheduledFor:
          type: string
          format: date
        refundAmount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
    BillingProfile:
      type: object
      additionalProperties: false
      required: [taxIdType, taxId, legalName, vatCondition, fiscalAddress, billingEmail]
      properties:
        taxIdType:
          type: string
          enum: [CUIT, DNI]
        taxId:
          type: string
          pattern: '^[0-9]{7,11}$'
        legalName:
          type: string
          minLength: 2
          maxLength: 200
        vatCondition:
          type: string
          enum: [RESPONSABLE_INSCRIPTO, MONOTRIBUTO, EXENTO, CONSUMIDOR_FINAL]
        fiscalAddress:
          type: string
          minLength: 5
          maxLength: 300
        billingEmail:
          type: string
          format: email
          maxLength: 254
    Invoice:
      type: object
      additionalProperties: false
      required: [id, voucherKind, voucherLetter, pointOfSale, issueDate, totalAmount, currency, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        voucherKind:
          type: string
          enum: [FACTURA, NOTA_DE_CREDITO]
        voucherLetter:
          type: string
          enum: [A, B, C]
        pointOfSale:
          type: integer
        voucherNumber:
          type: integer
        issueDate:
          type: string
          format: date
        servicePeriodFrom:
          type: string
          format: date
        servicePeriodTo:
          type: string
          format: date
        totalAmount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          enum: [ARS]
        status:
          type: string
          enum: [PENDIENTE, AUTORIZADA, RECHAZADA, ERROR]
        cae:
          type: string
        caeDueDate:
          type: string
          format: date
    InvoicePage:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invoice'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Export:
      type: object
      additionalProperties: false
      required: [id, status, format, requestedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [EN_PREPARACION, LISTA, VENCIDA, ERROR]
        format:
          type: string
          enum: [JSON, XLSX]
        requestedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          description: URL firmada, de un solo uso, válida por 24 horas. Solo con `LISTA`.
        expiresAt:
          type: string
          format: date-time

    # ------------------------------------------------------------ Back-office
    CalendarChangeSet:
      type: object
      additionalProperties: false
      required: [jurisdictionId, changes, reason]
      properties:
        jurisdictionId:
          $ref: '#/components/schemas/Id'
        reason:
          $ref: '#/components/schemas/Reason'
        confirmDelays:
          type: boolean
          default: false
          description: Obligatorio en `true` si algún vencimiento pendiente se atrasa.
        changes:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            additionalProperties: false
            required: [action, date, kind, scope]
            properties:
              action:
                type: string
                enum: [AGREGAR, QUITAR]
              date:
                type: string
                format: date
              kind:
                type: string
                enum: [FERIADO, FERIA, ASUETO]
              scope:
                type: string
                enum: [NACIONAL, PROVINCIAL, DEPARTAMENTO]
              departmentId:
                $ref: '#/components/schemas/Id'
              description:
                type: string
                maxLength: 200
              legalReference:
                type: string
                maxLength: 300
                description: Acordada o resolución. Obligatoria para `ASUETO` y `FERIA`.
    CalendarChangeImpact:
      type: object
      additionalProperties: false
      required: [affectedSteps, delayedSteps, advancedSteps, affectedOrganizations]
      properties:
        affectedSteps:
          type: integer
        delayedSteps:
          type: integer
          description: Pasos cuyo vencimiento se atrasa (el caso más peligroso).
        advancedSteps:
          type: integer
        affectedOrganizations:
          type: integer
        calendarVersion:
          type: integer
          description: Solo al aplicar.
    CalendarCoverage:
      type: object
      additionalProperties: false
      required: [jurisdictionId, coveredUntil, status]
      properties:
        jurisdictionId:
          $ref: '#/components/schemas/Id'
        coveredUntil:
          type: string
          format: date
        status:
          type: string
          enum: [PROVISORIO, OFICIAL]
        calendarVersion:
          type: integer
          readOnly: true
        validatedByUserId:
          $ref: '#/components/schemas/Id'
          description: Obligatorio para `OFICIAL`; tiene que ser un admin distinto de quien hace el cambio.
        validatedAt:
          type: string
          format: date-time
          readOnly: true
    FlowImport:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [VALIDA, CON_ERRORES, PUBLICADA]
        createdAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
        transitionCount:
          type: integer
        errors:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [sheet, message]
            properties:
              sheet:
                type: string
              row:
                type: integer
              message:
                type: string
    FlowVersionSummary:
      type: object
      additionalProperties: false
      required: [id, flowId, versionNumber, status, publishedAt, approvedByLegal, sourceChecksum]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        flowId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
        status:
          type: string
          enum: [BORRADOR, PUBLICADA, RETIRADA]
        publishedAt:
          type: string
          format: date-time
        approvedByLegal:
          type: string
        sourceChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 de la planilla importada.
    JurisdictionSchedule:
      type: object
      additionalProperties: false
      required: [jurisdictionId, validFrom, openingTime, closingTime, graceEndTime, legalReference]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        jurisdictionId:
          $ref: '#/components/schemas/Id'
        validFrom:
          type: string
          format: date
        openingTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        closingTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        graceEndTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        validTo:
          type: string
          format: date
        legalReference:
          type: string
          minLength: 3
          maxLength: 300
    DepartmentRegime:
      type: object
      additionalProperties: false
      required: [departmentId, proceduralRegimeCode, validFrom]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        departmentId:
          $ref: '#/components/schemas/Id'
        proceduralRegimeCode:
          type: string
          enum: [PBA_LAB_LEY_11653, PBA_LAB_LEY_15057]
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
