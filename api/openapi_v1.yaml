openapi: 3.1.0
info:
  title: Asistente Legal - API V1
  version: 0.1.0
  description: |
    Contrato de la API de la V1 (borrador v0.1). Se deriva de:
    - `modelo_de_base_de_datos_relacional.md` (entidades y estados);
    - `definicion_de_ui_ux_asistente_legal.md` (pantallas);
    - `logica_matematica_calculadora_de_dias_habiles_judiciales.md` (motor de plazos);
    - `modelado_de_amenazas_v1.md` (permisos y controles).

    **Convenciones**
    - JSON en camelCase. Fechas sin hora en `YYYY-MM-DD`; instantes en ISO 8601 con zona horaria.
    - **Autenticación:** login con Google (OIDC, Authorization Code con PKCE) manejado por Spring Security. La API usa la cookie de sesión `__Host-SESSION` (`HttpOnly`, `Secure`, `SameSite=Lax`).
    - **CSRF:** toda petición `POST`, `PUT`, `PATCH` o `DELETE` autenticada debe enviar el header `X-XSRF-TOKEN` con el valor de la cookie `XSRF-TOKEN`.
    - **Estudio activo:** sale siempre de la sesión. Ningún endpoint de `/api/v1` recibe el `organizationId` del estudio sobre el que opera, salvo para elegir el estudio activo. Un ID de otro estudio responde 404.
    - **Permisos:** la extensión `x-roles` indica qué roles del estudio pueden llamar cada operación (matriz de la sección 3 del modelado de amenazas). Sin `x-roles`, alcanza con estar autenticado.
    - **Solo lectura:** con la suscripción en `SOLO_LECTURA`, toda escritura sobre datos del estudio responde 403 con el tipo de problema `suscripcion-solo-lectura`.
    - **Validación:** los cuerpos no admiten campos desconocidos (`additionalProperties: false`). Los errores siguen RFC 9457 (`application/problem+json`) y nunca incluyen trazas ni detalles internos.
    - **Paginación:** `page` desde 0 y `size` entre 1 y 100 (por defecto 20).
    - **Límites:** las respuestas 429 incluyen `Retry-After` (valores en la sección 6 del modelado de amenazas).
servers:
  - url: https://app.example.com
    description: Producción (dominio a definir)
security:
  - cookieAuth: []
tags:
  - name: Sesión
  - name: Usuario
  - name: Documentos legales
  - name: Estudio
  - name: Catálogos
  - name: Clientes
  - name: Expedientes
  - name: Pasos
  - name: Motor de plazos
  - name: Alertas
  - name: Suscripción
  - name: Facturación
  - name: Exportación
  - name: Webhooks
  - name: Back-office

paths:
  # ---------------------------------------------------------------- Sesión
  /oauth2/authorization/google:
    get:
      tags: [Sesión]
      summary: Iniciar el login con Google
      description: Endpoint de Spring Security. Redirige a Google con PKCE. Al volver, crea la sesión propia y redirige a una ruta interna de la lista permitida.
      operationId: iniciarLogin
      security: []
      responses:
        '302':
          description: Redirección a Google.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/session:
    get:
      tags: [Sesión]
      summary: Sesión actual
      operationId: obtenerSesion
      responses:
        '200':
          description: Sesión activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session/logout:
    post:
      tags: [Sesión]
      summary: Cerrar la sesión actual
      operationId: cerrarSesion
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session/active-organization:
    put:
      tags: [Sesión]
      summary: Elegir el estudio activo
      description: Solo entre los estudios donde el usuario tiene una membresía activa.
      operationId: elegirEstudioActivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId:
                  $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Estudio activo actualizado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Usuario
  /api/v1/me:
    get:
      tags: [Usuario]
      summary: Perfil del usuario
      operationId: obtenerPerfil
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/devices:
    get:
      tags: [Usuario]
      summary: Mis dispositivos con sesión
      operationId: listarDispositivos
      responses:
        '200':
          description: Dispositivos.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [Usuario]
      summary: Revocar un dispositivo
      description: Cierra todas sus sesiones. Queda en la auditoría como `DISPOSITIVO_REVOCADO`.
      operationId: revocarDispositivo
      responses:
        '204':
          description: Dispositivo revocado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/notification-preferences:
    get:
      tags: [Usuario]
      summary: Preferencias de aviso en el estudio activo
      operationId: obtenerPreferencias
      responses:
        '200':
          description: Preferencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Usuario]
      summary: Actualizar las preferencias de aviso
      operationId: actualizarPreferencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferencias actualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Documentos legales
  /api/v1/legal-documents/current:
    get:
      tags: [Documentos legales]
      summary: Versiones vigentes de los documentos legales
      operationId: listarDocumentosVigentes
      security: []
      responses:
        '200':
          description: Términos, privacidad y encargo vigentes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/LegalDocumentVersion'
  /api/v1/legal-acceptances/pending:
    get:
      tags: [Documentos legales]
      summary: Documentos que el usuario todavía tiene que aceptar
      description: Incluye el acuerdo de encargo solo si el usuario es titular del estudio activo.
      operationId: listarAceptacionesPendientes
      responses:
        '200':
          description: Versiones pendientes de aceptación.
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/LegalDocumentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/legal-acceptances:
    post:
      tags: [Documentos legales]
      summary: Aceptar documentos legales
      description: Registra `legal_acceptances` y `DOCUMENTO_LEGAL_ACEPTADO`. El encargo solo lo puede aceptar el titular, en nombre del estudio activo.
      operationId: aceptarDocumentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentVersionIds]
              properties:
                documentVersionIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Aceptación registrada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Estudio
  /api/v1/organizations:
    post:
      tags: [Estudio]
      summary: Crear un estudio (onboarding)
      description: El usuario queda como `TITULAR` y el estudio empieza en `PRUEBA`. Exige haber aceptado los términos y la privacidad; el encargo se acepta inmediatamente después.
      operationId: crearEstudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Estudio creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organization:
    get:
      tags: [Estudio]
      summary: Estudio activo
      operationId: obtenerEstudio
      responses:
        '200':
          description: Estudio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Estudio]
      summary: Cambiar el nombre del estudio
      operationId: actualizarEstudio
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
      responses:
        '200':
          description: Estudio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organization/members:
    get:
      tags: [Estudio]
      summary: Miembros del estudio
      operationId: listarMiembros
      responses:
        '200':
          description: Miembros.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/organization/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Estudio]
      summary: Cambiar el rol de un miembro
      operationId: cambiarRolMiembro
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/MembershipRole'
      responses:
        '200':
          description: Rol actualizado (`ROL_CAMBIADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Estudio]
      summary: Revocar un miembro
      description: Revoca, en la misma transacción, las sesiones de ese usuario en el estudio. No se puede revocar al único titular.
      operationId: revocarMiembro
      x-roles: [TITULAR]
      responses:
        '204':
          description: Miembro revocado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/organization/invitations:
    post:
      tags: [Estudio]
      summary: Invitar a un miembro
      description: Envía un email con un token aleatorio de un solo uso, con vencimiento a los 7 días y atado al email invitado. Responde 409 si se superan los usuarios del plan.
      operationId: invitarMiembro
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  type: string
                  enum: [ABOGADO, ASISTENTE]
      responses:
        '201':
          description: Invitación creada (`MIEMBRO_INVITADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invitations/accept:
    post:
      tags: [Estudio]
      summary: Aceptar una invitación
      description: El token viaja en el cuerpo, nunca en la URL de la API. El email de la cuenta de Google tiene que coincidir con el invitado.
      operationId: aceptarInvitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 22
                  maxLength: 128
      responses:
        '200':
          description: Membresía activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/organization/alert-settings:
    get:
      tags: [Alertas]
      summary: Umbrales del semáforo y del resumen diario
      description: Devuelve los del estudio, o los globales si el estudio no tiene propios.
      operationId: obtenerParametrosAlertas
      responses:
        '200':
          description: Parámetros vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Alertas]
      summary: Ajustar los umbrales del estudio
      operationId: actualizarParametrosAlertas
      x-roles: [TITULAR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSettings'
      responses:
        '200':
          description: Parámetros actualizados (`ALERTAS_CONFIGURADAS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organization/holidays:
    post:
      tags: [Catálogos]
      summary: Marcar un día inhábil del estudio
      description: Alcance `ORGANIZACION`. Recalcula los pasos pendientes afectados.
      operationId: crearInhabilEstudio
      x-roles: [TITULAR, ABOGADO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date, description]
              properties:
                date:
                  type: string
                  format: date
                departmentId:
                  $ref: '#/components/schemas/Id'
                description:
                  type: string
                  minLength: 3
                  maxLength: 200
      responses:
        '201':
          description: Día inhábil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/organization/holidays/{holidayId}:
    parameters:
      - $ref: '#/components/parameters/HolidayId'
    delete:
      tags: [Catálogos]
      summary: Quitar un día inhábil del estudio
      operationId: borrarInhabilEstudio
      x-roles: [TITULAR, ABOGADO]
      responses:
        '204':
          description: Quitado y pasos recalculados.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Catálogos
  /api/v1/catalog/jurisdictions:
    get:
      tags: [Catálogos]
      summary: Jurisdicciones
      operationId: listarJurisdicciones
      responses:
        '200':
          description: Jurisdicciones.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog/departments:
    get:
      tags: [Catálogos]
      summary: Departamentos judiciales de una jurisdicción
      operationId: listarDepartamentos
      parameters:
        - name: jurisdictionId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Departamentos.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog/courts:
    get:
      tags: [Catálogos]
      summary: Tribunales de un departamento
      operationId: listarTribunales
      parameters:
        - name: departmentId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Tribunales.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog/regime-resolution:
    get:
      tags: [Catálogos]
      summary: Resolver el régimen procesal
      description: Aplica la "Resolución del régimen" del modelo de datos. Sirve para avisar en el alta antes de guardar.
      operationId: resolverRegimen
      parameters:
        - name: departmentId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: courtId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: claimFiledOn
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Resultado de la resolución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegimeResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/catalog/flow-versions/{flowVersionId}:
    parameters:
      - name: flowVersionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags: [Catálogos]
      summary: Hitos y transiciones de una versión de flujo
      description: Para el mapa del flujo y para elegir los hitos actuales al dar de alta un expediente en curso.
      operationId: obtenerVersionFlujo
      responses:
        '200':
          description: Grafo de la versión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/calendar:
    get:
      tags: [Catálogos]
      summary: Días inhábiles de un período
      description: Incluye los del sistema, los del departamento y los del estudio activo, más el estado de la cobertura del calendario. El rango máximo es de 366 días.
      operationId: obtenerCalendario
      parameters:
        - name: jurisdictionId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: departmentId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Calendario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Clientes
  /api/v1/clients:
    get:
      tags: [Clientes]
      summary: Listar y buscar clientes
      operationId: listarClientes
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Clientes]
      summary: Crear un cliente
      description: Crear un cliente no consume el límite del plan; cuenta cuando tiene un expediente activo o pausado.
      operationId: crearCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Clientes]
      summary: Obtener un cliente
      operationId: obtenerCliente
      responses:
        '200':
          description: Cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clientes]
      summary: Actualizar un cliente
      operationId: actualizarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clientes]
      summary: Eliminar un cliente
      description: Borrado lógico. Responde 409 si tiene expedientes activos o pausados.
      operationId: eliminarCliente
      x-roles: [TITULAR, ABOGADO]
      responses:
        '204':
          description: Cliente eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Expedientes
  /api/v1/cases:
    get:
      tags: [Expedientes]
      summary: Listar y buscar expedientes
      description: Búsqueda por carátula, número o cliente.
      operationId: listarExpedientes
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: clientId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: sort
          in: query
          schema:
            type: string
            enum: [PROXIMO_VENCIMIENTO, ULTIMA_ACTIVIDAD, CARATULA]
            default: PROXIMO_VENCIMIENTO
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de expedientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Expedientes]
      summary: Dar de alta un expediente
      description: |
        Alta nueva (arranca en el hito inicial) o alta de un expediente en curso (`inProgress`).
        - Si el cliente no cuenta como activo y el estudio llegó al límite de su tramo: 409 `limite-clientes`.
        - Si el régimen no se puede determinar: 422 `regimen-sin-definir`.
        - Si el régimen es inconsistente: se crea igual, con `regimeWarning`, y se audita.
        - Si el régimen no tiene flujo publicado (Ley 15.057 en la V1): se crea sin flujo y solo admite plazos sueltos.
      operationId: crearExpediente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: Expediente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Expedientes]
      summary: Ficha del expediente
      operationId: obtenerExpediente
      responses:
        '200':
          description: Expediente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Expedientes]
      summary: Editar los datos del expediente
      description: El tribunal no se puede cambiar si ya hay un flujo judicial asignado (el régimen no cambia).
      operationId: actualizarExpediente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdate'
      responses:
        '200':
          description: Expediente actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Expedientes]
      summary: Eliminar un expediente
      description: Borrado lógico, auditado.
      operationId: eliminarExpediente
      x-roles: [TITULAR, ABOGADO]
      responses:
        '204':
          description: Expediente eliminado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/judicial-flow:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Expedientes]
      summary: Interponer la demanda (asignar el flujo judicial)
      description: Para un expediente que venía en la etapa previa. Resuelve el régimen con el tribunal y la fecha de interposición, y abre el hito inicial del flujo judicial.
      operationId: asignarFlujoJudicial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [courtId, claimFiledOn]
              properties:
                courtId:
                  $ref: '#/components/schemas/Id'
                claimFiledOn:
                  type: string
                  format: date
      responses:
        '200':
          description: Flujo judicial asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Expedientes]
      summary: Terminar el expediente
      description: Libera el lugar en el límite de clientes si era el último expediente activo del cliente.
      operationId: terminarExpediente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [closedOn, closedReason]
              properties:
                closedOn:
                  type: string
                  format: date
                closedReason:
                  type: string
                  enum: [SENTENCIA, ACUERDO, DESISTIMIENTO, OTRO]
      responses:
        '200':
          description: Expediente terminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/reopen:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Expedientes]
      summary: Reactivar un expediente terminado
      description: Aplica el control del límite de clientes (409 `limite-clientes`).
      operationId: reactivarExpediente
      responses:
        '200':
          description: Expediente activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/roadmap:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Expedientes]
      summary: Mapa del flujo con el estado de cada hito
      operationId: obtenerMapa
      responses:
        '200':
          description: Mapa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roadmap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Expedientes]
      summary: Historial auditado del expediente
      operationId: obtenerHistorial
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/parties:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Expedientes]
      summary: Partes del expediente
      operationId: listarPartes
      responses:
        '200':
          description: Partes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/Party'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Expedientes]
      summary: Agregar una parte
      operationId: crearParte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '201':
          description: Parte creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/parties/{partyId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: partyId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    put:
      tags: [Expedientes]
      summary: Actualizar una parte
      operationId: actualizarParte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '200':
          description: Parte actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Expedientes]
      summary: Quitar una parte
      operationId: borrarParte
      responses:
        '204':
          description: Parte quitada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/suspensions:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Expedientes]
      summary: Suspensiones de plazos del expediente
      operationId: listarSuspensiones
      responses:
        '200':
          description: Suspensiones.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Suspension'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Expedientes]
      summary: Cargar una suspensión de plazos
      description: Recalcula los pasos pendientes del expediente (`SUSPENSION_CARGADA`).
      operationId: crearSuspension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensionInput'
      responses:
        '201':
          description: Suspensión cargada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suspension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/suspensions/{suspensionId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: suspensionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [Expedientes]
      summary: Quitar una suspensión
      description: Recalcula los pasos pendientes del expediente.
      operationId: borrarSuspension
      responses:
        '204':
          description: Suspensión quitada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Pasos
  /api/v1/cases/{caseId}/steps:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Pasos]
      summary: Pasos del expediente
      operationId: listarPasos
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StepStatus'
      responses:
        '200':
          description: Pasos, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Step'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Pasos]
      summary: Agregar un plazo suelto
      description: Paso sin hito (`nodeId = null`). Usa el mismo motor y las mismas alertas y no cambia la posición en el flujo (`PLAZO_SUELTO_CREADO`).
      operationId: crearPlazoSuelto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandaloneStepCreate'
      responses:
        '201':
          description: Plazo suelto creado y calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/cases/{caseId}/steps/{stepId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    get:
      tags: [Pasos]
      summary: Detalle de un paso, con su checklist y sus transiciones posibles
      operationId: obtenerPaso
      responses:
        '200':
          description: Paso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cases/{caseId}/steps/{stepId}/deadline:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    put:
      tags: [Pasos]
      summary: Cargar o corregir los datos del plazo
      description: |
        El backend recalcula el vencimiento. El cliente nunca envía un vencimiento calculado.
        - Si `termValue` difiere del valor del hito, `termOverrideReason` es obligatorio.
        - `manualDue` solo se acepta en un paso cargado con el expediente en curso, con motivo (`calculationStatus = MANUAL`).
      operationId: actualizarPlazo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineUpdate'
      responses:
        '200':
          description: Paso recalculado (`PLAZO_EDITADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/cases/{caseId}/steps/{stepId}/advance:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Avanzar de etapa
      description: Completa el paso por la transición elegida y abre los pasos de destino (uno o varios en paralelo), sin Día Cero hasta que se cargue (`PASO_COMPLETADO`).
      operationId: avanzarEtapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transitionId]
              properties:
                transitionId:
                  $ref: '#/components/schemas/Id'
                filedAt:
                  type: string
                  format: date-time
                  description: Fecha y hora del cargo, si se presentó un escrito.
      responses:
        '200':
          description: Paso completado y pasos abiertos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/skip:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Saltear la etapa manualmente
      operationId: saltearEtapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transitionId, reason]
              properties:
                transitionId:
                  $ref: '#/components/schemas/Id'
                reason:
                  $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Paso salteado (`ETAPA_SALTEADA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/revert:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Retroceder etapa
      description: |
        `stepId` es el paso `COMPLETADO` cuyo avance se deshace. Los pasos que abrió pasan a `ANULADO` y él vuelve a `PENDIENTE` (`ETAPA_RETROCEDIDA`).
        - 409 `retroceso-con-dependientes` si los pasos a anular abrieron otros.
        - 409 `retroceso-requiere-confirmacion` si tienen actividad y `confirmActivity` es `false`; el problema lista qué actividad tienen.
      operationId: retrocederEtapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/Reason'
                confirmActivity:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Retroceso aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepRevertResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/complete:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Marcar como cumplido un plazo suelto, o un vencido ("Lo cumplí")
      description: En un hito con transiciones se usa `advance`; este endpoint es para plazos sueltos y para registrar el cargo de un paso vencido.
      operationId: marcarCumplido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filedAt]
              properties:
                filedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Paso completado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/not-fulfilled:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Registrar que un plazo no se cumplió
      description: Solo sobre un paso vencido. Si se indica `transitionId` (por ejemplo, "No contesta en término"), avanza por esa salida (`PLAZO_NO_CUMPLIDO`).
      operationId: registrarNoCumplido
      x-roles: [TITULAR, ABOGADO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/Reason'
                transitionId:
                  $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Paso en `NO_CUMPLIDO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepTransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/annul:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [Pasos]
      summary: Anular un plazo suelto cargado por error
      description: Solo para plazos sueltos; los hitos se corrigen con `revert`.
      operationId: anularPlazoSuelto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Paso anulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cases/{caseId}/steps/{stepId}/checklist-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/StepId'
